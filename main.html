<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Duo Owl Message</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 90%;
      max-width: 800px;
      height: 85vh;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #58cc02;
      color: white;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
    }

    .chat {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
    }

    .duo {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 20px;
    }

    .duo img {
      width: 120px;
      max-height: 160px;
      object-fit: contain;
    }

    .bubble {
      background: #eeeeee;
      padding: 15px;
      border-radius: 18px;
      max-width: 500px;
      font-size: 17px;
    }

    .user {
      text-align: right;
      margin: 15px 0;
    }

    .user .bubble {
      display: inline-block;
      background: #58cc02;
      color: white;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: #58cc02;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #46a302;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      🦉 Duo Owl Message
    </div>

    <div class="chat" id="chat">

      <div class="duo">
        <img src="assets/duolingo_hi.png" alt="Duo waving">

        <div class="bubble" id="duoGreeting">
          Good morning, Henry! 👋 I'm Duo. I think we're gonna be besties!
        </div>
      </div>

    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Talk to Duo..."
        autocomplete="off"
      >

      <button onclick="sendMessage()">Send</button>

    </div>

  </div>

  <!-- Load Duo's happy messages -->
  <script src="replys/happy.js"></script>

  <script>
    const otherReplies = [
      "Hmm... interesting. 👀",
      "I'm listening, bestie! 🦉",
      "Okay, tell me more!",
      "My owl brain is thinking... 🤔",
      "That's actually pretty cool!",
      "Wait... what? 😂",
      "You have my full attention. 👀",
      "Okay Henry, I'm here!",
      "I have absolutely no idea what to say to that. 😭",
      "Interesting... very interesting. 🦉"
    ];

    function randomReply(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (text === "") return;

      addUserMessage(text);

      const lower = text.toLowerCase();
      let reply;

      if (
        lower.includes("hello") ||
        lower.includes("hi") ||
        lower.includes("hey") ||
        lower.includes("good morning") ||
        lower.includes("good night")
      ) {
        reply = randomReply(happyMessages);
      } else {
        reply = randomReply(otherReplies);
      }

      setTimeout(() => {
        addDuoMessage(reply);
      }, 500);

      input.value = "";
    }

    function addUserMessage(text) {
      const chat = document.getElementById("chat");

      const user = document.createElement("div");
      user.className = "user";

      user.innerHTML = `
        <div class="bubble">
          ${escapeHTML(text)}
        </div>
      `;

      chat.appendChild(user);
      chat.scrollTop = chat.scrollHeight;
    }

    function addDuoMessage(text) {
      const chat = document.getElementById("chat");

      const duo = document.createElement("div");
      duo.className = "duo";

      duo.innerHTML = `
        <img src="assets/duolingo_hi.png" alt="Duo">
        <div class="bubble">${escapeHTML(text)}</div>
      `;

      chat.appendChild(duo);
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    document
      .getElementById("messageInput")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      });
  </script>

</body>
</html>
