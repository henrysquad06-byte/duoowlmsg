<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Duo Owl Message</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 90%;
      max-width: 800px;
      height: 85vh;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #58cc02;
      color: white;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
    }

    .chat {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
    }

    .duo {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 20px;
    }

    .duo img {
      width: 120px;
      max-height: 160px;
      object-fit: contain;
    }

    .bubble {
      background: #eeeeee;
      padding: 15px;
      border-radius: 18px;
      max-width: 500px;
      font-size: 17px;
    }

    .user {
      text-align: right;
      margin: 15px 0;
    }

    .user .bubble {
      display: inline-block;
      background: #58cc02;
      color: white;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: #58cc02;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #46a302;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      🦉 Duo Owl Message
    </div>

    <div class="chat" id="chat">

      <div class="duo">
        <img src="assets/duolingo_hi.png" alt="Duo waving">

        <div class="bubble" id="duoGreeting">
          Good morning, Henry! 👋 I'm Duo. I think we're gonna be besties!
        </div>
      </div>

    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Talk to Duo..."
        autocomplete="off"
      >

      <button onclick="sendMessage()">Send</button>

    </div>

  </div>


  <!-- ================================ -->
  <!-- DUO'S BRAIN FILES                -->
  <!-- ================================ -->

  <!-- Happy replies -->
  <script src="replys/happy.js"></script>

  <!-- Main conversation brain -->
  <script src="replys/brain.js"></script>

  <!-- Math brain -->
  <script src="brain/math/addition.js"></script>

  <script src="brain/math/addition.js"></script>
<script src="brain/chess/chessmoves.js"></script>


  <script>

    function sendMessage() {

      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (text === "") return;

      // Show Henry's message
      addUserMessage(text);

      let reply = null;


      // ==========================================
      // TRY THE ADDITION BRAIN FIRST
      // ==========================================

      if (typeof getAdditionReply === "function") {

        reply = getAdditionReply(text);

      }


      // ==========================================
      // IF IT WASN'T MATH, USE DUO'S MAIN BRAIN
      // ==========================================

      if (
        reply === null &&
        typeof getDuoReply === "function"
      ) {

        reply = getDuoReply(text);

      }


      // ==========================================
      // EMERGENCY FALLBACK
      // ==========================================

      if (!reply) {

        reply = "Hmm... my owl brain is still learning that one. 🦉🧠";

      }


      // ==========================================
      // DUO THINKING DELAY
      // ==========================================

      setTimeout(() => {

        addDuoMessage(reply);

      }, 500);


      input.value = "";

    }


    // ==========================================
    // ADD USER MESSAGE
    // ==========================================

    function addUserMessage(text) {

      const chat = document.getElementById("chat");

      const user = document.createElement("div");

      user.className = "user";

      user.innerHTML = `
        <div class="bubble">
          ${escapeHTML(text)}
        </div>
      `;

      chat.appendChild(user);

      chat.scrollTop = chat.scrollHeight;

    }


    // ==========================================
    // ADD DUO MESSAGE
    // ==========================================

    function addDuoMessage(text) {

      const chat = document.getElementById("chat");

      const duo = document.createElement("div");

      duo.className = "duo";

      duo.innerHTML = `
        <img
          src="assets/duolingo_hi.png"
          alt="Duo"
        >

        <div class="bubble">
          ${escapeHTML(text)}
        </div>
      `;

      chat.appendChild(duo);

      chat.scrollTop = chat.scrollHeight;

    }


    // ==========================================
    // SECURITY
    // ==========================================

    function escapeHTML(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    // ==========================================
    // ENTER KEY
    // ==========================================

    document
      .getElementById("messageInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          sendMessage();

        }

      });

  </script>

</body>
</html>
